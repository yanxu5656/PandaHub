<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PandaHub - 大厅</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 视频背景 -->
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="assets/【哲风壁纸】动画-卡通-叠罗汉.mp4" type="video/mp4">
  </video>

  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo-icon">🐼</span>
        <h1>PandaHub</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="lobby.html" class="nav-item active">
          <span class="icon">🏠</span>
          <span>大厅</span>
        </a>
        <a href="schedule.html" class="nav-item">
          <span class="icon">📅</span>
          <span>时间协调</span>
        </a>
        <a href="polls.html" class="nav-item">
          <span class="icon">🗳️</span>
          <span>投票</span>
        </a>
        <a href="games.html" class="nav-item">
          <span class="icon">📚</span>
          <span>游戏库</span>
        </a>
        <a href="mini-games.html" class="nav-item">
          <span class="icon">🎯</span>
          <span>小游戏</span>
        </a>
        <a href="admin.html" class="nav-item">
          <span class="icon">⚙️</span>
          <span>管理</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-avatar" id="user-avatar">🐼</div>
        <div class="user-info" id="edit-profile-btn">
          <div class="user-name" id="user-name">加载中...</div>
          <div class="user-hint">点击编辑</div>
        </div>
        <button class="logout-btn" id="logout-btn" title="退出登录">🚪</button>
      </div>
    </aside>

    <!-- 主内容 -->
    <main class="main-content">
      <div class="page-header">
        <h1>🏠 大厅</h1>
        <p>欢迎回到胖达窝！</p>
      </div>

      <div class="lobby-grid">
        <!-- 在线成员 -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">👥 成员</h3>
            <span id="online-count" class="online-count">0 在线</span>
          </div>
          <div class="scrollable-list">
            <div id="members-list" class="members-list">
              <!-- 成员列表由JS填充 -->
            </div>
          </div>
        </div>

        <!-- 快速入口 -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">⚡ 快速入口</h3>
          </div>
          <div class="quick-actions">
            <a href="schedule.html" class="quick-action-item">
              <span class="icon">📅</span>
              <span>填写本周时间</span>
            </a>
            <a href="polls.html" class="quick-action-item">
              <span class="icon">🗳️</span>
              <span>发起投票</span>
            </a>
            <a href="games.html" class="quick-action-item">
              <span class="icon">📚</span>
              <span>管理游戏库</span>
            </a>
            <a href="mini-games.html" class="quick-action-item">
              <span class="icon">🎯</span>
              <span>玩小游戏</span>
            </a>
          </div>
        </div>

        <!-- 通知 -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">🔔 通知</h3>
            <button id="mark-all-read" class="btn btn-ghost btn-sm">全部已读</button>
          </div>
          <div class="scrollable-list">
            <div id="notifications-list" class="notifications-list">
              <p class="empty-text">暂无通知</p>
            </div>
          </div>
        </div>

        <!-- 进行中的投票 -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">🗳️ 进行中的投票</h3>
            <a href="polls.html" class="btn btn-ghost btn-sm">查看全部</a>
          </div>
          <div id="active-polls" class="active-polls">
            <p class="empty-text">暂无进行中的投票</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 个人信息模态框 -->
  <div id="profile-modal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <h2>编辑个人信息</h2>
      <div class="input-group">
        <label>邮箱</label>
        <input type="email" id="profile-email" disabled style="opacity:0.6;">
      </div>
      <div class="input-group">
        <label>昵称</label>
        <input type="text" id="profile-nickname" placeholder="你的昵称">
      </div>
      <div class="input-group">
        <label>头像</label>
        <div class="avatar-picker" id="profile-avatar-picker">
          <!-- 头像选项由JS生成 -->
        </div>
      </div>
      <div class="modal-actions">
        <button id="cancel-profile-btn" class="btn btn-ghost">取消</button>
        <button id="save-profile-btn" class="btn btn-accent">保存</button>
      </div>
    </div>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/fix.js"></script>
  <script>
    // 初始化个人信息模态框的头像选择器
    document.addEventListener('DOMContentLoaded', () => {
      const picker = document.getElementById('profile-avatar-picker');
      if (picker && typeof AVATARS !== 'undefined') {
        AVATARS.forEach((avatar, index) => {
          const option = document.createElement('div');
          option.className = 'avatar-option';
          option.textContent = avatar;
          option.dataset.avatar = avatar;
          if (index === 0) option.classList.add('selected');
          option.addEventListener('click', () => {
            picker.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected'));
            option.classList.add('selected');
          });
          picker.appendChild(option);
        });
      }
    });
  </script>
  <script src="js/lobby.js"></script>
</body>
</html>
