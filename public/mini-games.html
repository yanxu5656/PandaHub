<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="小圈子辅助应用 - 时间协调、投票、游戏库">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900<title>PandaHubfamily=Noto+Sans+SC:wght@300;400;500;600;700<title>PandaHubdisplay=swap" rel="stylesheet">
  <title>PandaHub - 小游戏</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .game-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 32px; }
    .game-card-btn {
      background: var(--surface-1);
      border: 2px solid var(--border);
      border-radius: var(--r-lg);
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }
    .game-card-btn:hover {
      border-color: var(--neon-cyan);
      transform: translateY(-4px);
      box-shadow: 0 8px 30px var(--neon-cyan-dim);
    }
    .game-card-btn .icon { font-size: 48px; display: block; margin-bottom: 16px; }
    .game-card-btn .title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .game-card-btn .desc { font-size: 13px; color: var(--text-3); margin-bottom: 12px; }
    .game-card-btn .players {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--neon-cyan);
      background: var(--neon-cyan-dim);
      padding: 4px 12px;
      border-radius: var(--r-sm);
      display: inline-block;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <!-- 视频背景 -->
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="assets/【哲风壁纸】动画-卡通-叠罗汉.mp4" type="video/mp4">
  </video>
  <div class="app-container page-transition">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo-icon">🐼</span>
        <h1>PandaHub</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="lobby.html" class="nav-item"><span class="icon">🏠</span><span>大厅</span></a>
        <a href="schedule.html" class="nav-item"><span class="icon">📅</span><span>时间协调</span></a>
        <a href="polls.html" class="nav-item"><span class="icon">🗳️</span><span>投票</span></a>
        <a href="games.html" class="nav-item"><span class="icon">📚</span><span>游戏库</span></a>
        <a href="mini-games.html" class="nav-item active"><span class="icon">🎯</span><span>小游戏</span></a>
        <a href="admin.html" class="nav-item"><span class="icon">⚙️</span><span>管理</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-avatar" id="user-avatar">🐼</div>
        <div class="user-info">
          <div class="user-name" id="user-name">加载中...</div>
        </div>
        <button class="logout-btn" id="logout-btn" title="退出登录">🚪</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>🎯 小游戏</h1>
        <p>等人的时候来一局！</p>
      </div>

      <!-- 游戏选择 -->
      <div class="game-cards">
        <div class="game-card-btn" onclick="createRoom('tictactoe')">
          <span class="icon">❌</span>
          <div class="title">井字棋</div>
          <div class="desc">经典对弈，三子连线获胜</div>
          <span class="players">2 人</span>
        </div>
        <div class="game-card-btn" onclick="createRoom('gomoku')">
          <span class="icon">⚫</span>
          <div class="title">五子棋</div>
          <div class="desc">先连成五子者获胜</div>
          <span class="players">2 人</span>
        </div>
        <div class="game-card-btn" onclick="createRoom('draw')">
          <span class="icon">🎨</span>
          <div class="title">你画我猜</div>
          <div class="desc">一人画，其他人猜</div>
          <span class="players">2-8 人</span>
        </div>
      </div>

      <!-- 进行中的房间 -->
      <div style="margin-top:40px;">
        <div class="section-title">
          🎮 进行中的游戏
          <button class="btn btn-ghost btn-sm" onclick="loadRooms()">刷新</button>
        </div>
        <div id="rooms-list" class="rooms-list">
          <p class="empty-text">加载中...</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/fix.js"></script>
  <script src="js/mini-games.js"></script>
</body>
</html>
