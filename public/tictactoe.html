<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="小圈子辅助应用 - 时间协调、投票、游戏库">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900<title>PandaHubfamily=Noto+Sans+SC:wght@300;400;500;600;700<title>PandaHubdisplay=swap" rel="stylesheet">
  <title>PandaHub - 井字棋</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .game-container { max-width: 500px; margin: 0 auto; text-align: center; }
    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 20px auto;
      max-width: 300px;
    }
    .game-cell {
      width: 90px;
      height: 90px;
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: var(--r-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .game-cell:hover:not(.disabled) { border-color: var(--neon-cyan); background: var(--surface-3); }
    .game-cell.x { color: var(--neon-cyan); text-shadow: 0 0 20px var(--neon-cyan-glow); }
    .game-cell.o { color: var(--neon-magenta); text-shadow: 0 0 20px var(--neon-magenta-glow); }
    .game-cell.disabled { pointer-events: none; opacity: 0.5; }
    .status-bar {
      font-size: 16px;
      margin: 16px 0;
      padding: 12px 16px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
    }
    .players-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 16px 0;
    }
    .player-slot {
      padding: 12px 20px;
      background: var(--surface-1);
      border: 2px solid var(--border);
      border-radius: var(--r-md);
      min-width: 120px;
    }
    .player-slot.active { border-color: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan-dim); }
    .player-slot .symbol { font-size: 20px; margin-right: 6px; }
    .player-slot .name { font-weight: 600; }
    .player-slot .waiting { color: var(--text-3); font-style: italic; }
    .btn-group { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
    .info-box {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 16px;
      margin-top: 20px;
      text-align: left;
    }
    .info-box h4 { margin-bottom: 10px; color: var(--neon-cyan); }
    .info-box p { font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  </style>
</head>
<body>
  <!-- 视频背景 -->
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="assets/【哲风壁纸】动画-卡通-叠罗汉.mp4" type="video/mp4">
  </video>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo-icon">🐼</span>
        <h1>PandaHub</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="lobby.html" class="nav-item"><span class="icon">🏠</span><span>大厅</span></a>
        <a href="schedule.html" class="nav-item"><span class="icon">📅</span><span>时间协调</span></a>
        <a href="polls.html" class="nav-item"><span class="icon">🗳️</span><span>投票</span></a>
        <a href="games.html" class="nav-item"><span class="icon">📚</span><span>游戏库</span></a>
        <a href="mini-games.html" class="nav-item active"><span class="icon">🎯</span><span>小游戏</span></a>
        <a href="admin.html" class="nav-item"><span class="icon">⚙️</span><span>管理</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-avatar" id="user-avatar">🐼</div>
        <div class="user-info">
          <div class="user-name" id="user-name">加载中...</div>
        </div>
        <button class="logout-btn" id="logout-btn" title="退出登录">🚪</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="game-container">
        <div class="page-header">
          <h1>❌ 井字棋</h1>
        </div>

        <!-- 玩家信息 -->
        <div class="players-bar">
          <div class="player-slot" id="player-x">
            <span class="symbol">❌</span>
            <span class="name" id="player-x-name"><span class="waiting">等待加入...</span></span>
          </div>
          <div class="player-slot" id="player-o">
            <span class="symbol">⭕</span>
            <span class="name" id="player-o-name"><span class="waiting">等待加入...</span></span>
          </div>
        </div>

        <!-- 状态栏 -->
        <div class="status-bar" id="game-status">加载中...</div>

        <!-- 棋盘 -->
        <div class="game-board" id="game-board">
          <div class="game-cell disabled" data-index="0"></div>
          <div class="game-cell disabled" data-index="1"></div>
          <div class="game-cell disabled" data-index="2"></div>
          <div class="game-cell disabled" data-index="3"></div>
          <div class="game-cell disabled" data-index="4"></div>
          <div class="game-cell disabled" data-index="5"></div>
          <div class="game-cell disabled" data-index="6"></div>
          <div class="game-cell disabled" data-index="7"></div>
          <div class="game-cell disabled" data-index="8"></div>
        </div>

        <!-- 操作按钮 -->
        <div class="btn-group">
          <button id="add-ai-btn" class="btn btn-accent" style="display:none;">🤖 添加 AI 对手</button>
          <button id="restart-btn" class="btn btn-accent" style="display:none;">🔄 再来一局</button>
          <a href="mini-games.html" class="btn btn-ghost">← 返回大厅</a>
        </div>

        <!-- 操作说明 -->
        <div class="info-box">
          <h4>🎮 游戏说明</h4>
          <p>• 创建房间后，点击"添加 AI 对手"开始游戏</p>
          <p>• 或者等待另一个玩家加入</p>
          <p>• 先连成三子者获胜</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/fix.js"></script>
  <script>
    const AI_UUID = '00000000-0000-0000-0000-000000000001';
    let roomData = null;
    let players = [];
    let mySymbol = null;
    let currentTurn = 'X';
    let gameOver = false;
    let isAITurn = false;

    document.addEventListener('DOMContentLoaded', async () => {
      const loggedIn = await checkAuth();
      if (!loggedIn) { window.location.href = 'index.html'; return; }
      displayUserInfo();

      const urlParams = new URLSearchParams(window.location.search);
      const roomId = urlParams.get('room');
      if (!roomId) { alert('无效房间'); window.location.href = 'mini-games.html'; return; }

      await loadRoom(roomId);

      document.getElementById('logout-btn').addEventListener('click', handleLogout);
      document.getElementById('restart-btn').addEventListener('click', () => resetGame(roomId));
      document.getElementById('add-ai-btn').addEventListener('click', () => addAIPlayer(roomId));

      document.querySelectorAll('.game-cell').forEach(cell => {
        cell.addEventListener('click', () => makeMove(cell, roomId));
      });

      subscribeToGameUpdates(roomId);
    });

    function displayUserInfo() {
      if (currentProfile) {
        document.getElementById('user-avatar').textContent = currentProfile.avatar || '🐼';
        document.getElementById('user-name').textContent = currentProfile.nickname || '未知用户';
      }
    }

    async function loadRoom(roomId) {
      try {
        // 1. 获取房间
        const { data: room, error: roomError } = await db
          .from('game_rooms').select('*').eq('id', roomId).single();

        if (roomError || !room) {
          console.error('房间不存在:', roomError);
          alert('房间不存在或已被删除');
          window.location.href = 'mini-games.html';
          return;
        }
        roomData = room;

        // 2. 获取玩家
        const { data: roomPlayers } = await db
          .from('game_room_players').select('member_id, score').eq('room_id', roomId).order('created_at');

        // 3. 解析玩家信息
        players = [];
        if (roomPlayers) {
          for (const rp of roomPlayers) {
            if (rp.member_id === AI_UUID) {
              players.push({ ...rp, member: null, isAI: true });
            } else if (rp.member_id) {
              const { data: member } = await db
                .from('members').select('id, nickname, avatar').eq('id', rp.member_id).single();
              players.push({ ...rp, member, isAI: false });
            }
          }
        }

        // 4. 确定我的符号
        mySymbol = null;
        if (players.length >= 1 && players[0].member_id === currentUser.id) mySymbol = 'X';
        else if (players.length >= 2 && players[1].member_id === currentUser.id) mySymbol = 'O';

        updateUI();
      } catch (err) {
        console.error('加载房间异常:', err);
        alert('加载失败：' + err.message);
      }
    }

    function updateUI() {
      const status = document.getElementById('game-status');
      const addAiBtn = document.getElementById('add-ai-btn');
      const restartBtn = document.getElementById('restart-btn');

      // 更新玩家显示
      const p1Name = document.getElementById('player-x-name');
      const p2Name = document.getElementById('player-o-name');

      p1Name.innerHTML = players[0] ?
        (players[0].isAI ? '🤖 AI' : `<span class="name">${players[0].member?.nickname || '未知'}</span>`) :
        '<span class="waiting">等待加入...</span>';

      p2Name.innerHTML = players[1] ?
        (players[1].isAI ? '🤖 AI' : `<span class="name">${players[1].member?.nickname || '未知'}</span>`) :
        '<span class="waiting">等待加入...</span>';

      // 高亮当前玩家
      const state = roomData.state || {};
      currentTurn = state.currentTurn || 'X';
      gameOver = state.gameOver || false;

      document.getElementById('player-x').className = `player-slot ${currentTurn === 'X' && !gameOver ? 'active' : ''}`;
      document.getElementById('player-o').className = `player-slot ${currentTurn === 'O' && !gameOver ? 'active' : ''}`;

      // 按钮显示逻辑
      const isHost = roomData.host_id === currentUser.id;
      const has2Players = players.length >= 2;
      const isWaiting = roomData.status === 'waiting';

      // 添加 AI 按钮：房主、不到2人、等待中
      addAiBtn.style.display = (isHost && !has2Players && isWaiting) ? 'inline-flex' : 'none';

      // 再来一局按钮：游戏结束
      restartBtn.style.display = gameOver ? 'inline-flex' : 'none';

      // 状态文字
      if (gameOver) {
        if (state.winner) {
          const winnerName = state.winner === 'X' ?
            (players[0]?.isAI ? '🤖 AI' : (players[0]?.member?.nickname || '未知')) :
            (players[1]?.isAI ? '🤖 AI' : (players[1]?.member?.nickname || '未知'));
          status.textContent = `🎉 ${winnerName} 获胜！`;
        } else {
          status.textContent = '🤝 平局！';
        }
      } else if (!has2Players) {
        status.textContent = '⏳ 等待对手加入...（点击下方"添加 AI 对手"可立即开始）';
      } else {
        const currentName = currentTurn === 'X' ?
          (players[0]?.isAI ? '🤖 AI' : (players[0]?.member?.nickname || '未知')) :
          (players[1]?.isAI ? '🤖 AI' : (players[1]?.member?.nickname || '未知'));
        const isMyTurn = mySymbol === currentTurn;
        status.textContent = isMyTurn ? '🎯 轮到你了！点击棋盘下棋' : `⏳ 等待 ${currentName} 下棋...`;
      }

      // 渲染棋盘
      const board = state.board || Array(9).fill(null);
      const canPlay = has2Players && !gameOver && mySymbol === currentTurn && !isAITurn;

      document.querySelectorAll('.game-cell').forEach((cell, index) => {
        cell.textContent = board[index] || '';
        cell.className = `game-cell ${board[index] ? board[index].toLowerCase() : ''} ${!canPlay ? 'disabled' : ''}`;
      });

      // AI 自动下棋
      if (!gameOver && has2Players) {
        const isAITurnNow = (currentTurn === 'X' && players[0]?.isAI) || (currentTurn === 'O' && players[1]?.isAI);
        if (isAITurnNow) {
          setTimeout(() => makeAIMove(roomData.id), 500);
        }
      }
    }

    async function addAIPlayer(roomId) {
      if (players.length >= 2) {
        alert('房间已满');
        return;
      }

      try {
        console.log('添加 AI 玩家到房间:', roomId);

        // 1. 插入 AI 玩家
        const { error: insertError } = await db
          .from('game_room_players')
          .insert({
            room_id: parseInt(roomId),
            member_id: AI_UUID,
            score: 0
          });

        if (insertError) {
          console.error('插入 AI 失败:', insertError);
          alert('添加 AI 失败：' + insertError.message);
          return;
        }

        console.log('AI 插入成功，更新房间状态');

        // 2. 更新房间状态
        const { error: updateError } = await db
          .from('game_rooms')
          .update({ status: 'playing' })
          .eq('id', parseInt(roomId));

        if (updateError) {
          console.error('更新房间失败:', updateError);
        }

        console.log('重新加载房间');
        await loadRoom(roomId);
      } catch (err) {
        console.error('添加 AI 异常:', err);
        alert('添加 AI 失败：' + err.message);
      }
    }

    async function makeAIMove(roomId) {
      if (gameOver || isAITurn) return;

      const state = roomData.state || {};
      const board = state.board || Array(9).fill(null);
      const isAITurnNow = (currentTurn === 'X' && players[0]?.isAI) || (currentTurn === 'O' && players[1]?.isAI);
      if (!isAITurnNow) return;

      isAITurn = true;
      const move = getBestMove(board, currentTurn);

      if (move !== -1) {
        board[move] = currentTurn;
        const winner = checkWinner(board);
        const isDraw = !winner && board.every(c => c !== null);

        await db.from('game_rooms').update({
          state: { board, currentTurn: currentTurn === 'X' ? 'O' : 'X', gameOver: winner || isDraw, winner: winner || null }
        }).eq('id', roomId);
      }
      isAITurn = false;
    }

    function getBestMove(board, symbol) {
      const opponent = symbol === 'X' ? 'O' : 'X';

      // 能赢就赢
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = symbol;
          if (checkWinner(board) === symbol) { board[i] = null; return i; }
          board[i] = null;
        }
      }

      // 防守
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = opponent;
          if (checkWinner(board) === opponent) { board[i] = null; return i; }
          board[i] = null;
        }
      }

      // 中心
      if (!board[4]) return 4;

      // 角落
      const corners = [0, 2, 6, 8].filter(i => !board[i]);
      if (corners.length > 0) return corners[Math.floor(Math.random() * corners.length)];

      // 边
      const edges = [1, 3, 5, 7].filter(i => !board[i]);
      if (edges.length > 0) return edges[Math.floor(Math.random() * edges.length)];

      return -1;
    }

    async function makeMove(cell, roomId) {
      if (gameOver || !mySymbol || mySymbol !== currentTurn || isAITurn) return;
      if (players.length < 2) return;

      const index = parseInt(cell.dataset.index);
      const state = roomData.state || {};
      const board = state.board || Array(9).fill(null);
      if (board[index]) return;

      board[index] = mySymbol;
      const winner = checkWinner(board);
      const isDraw = !winner && board.every(c => c !== null);

      await db.from('game_rooms').update({
        state: { board, currentTurn: mySymbol === 'X' ? 'O' : 'X', gameOver: winner || isDraw, winner: winner || null }
      }).eq('id', roomId);
    }

    function checkWinner(board) {
      const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for (const [a,b,c] of lines) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
      }
      return null;
    }

    async function resetGame(roomId) {
      await db.from('game_rooms').update({
        state: { board: Array(9).fill(null), currentTurn: 'X', gameOver: false, winner: null }
      }).eq('id', roomId);
    }

    function subscribeToGameUpdates(roomId) {
      db.channel(`ttt-${roomId}`)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_rooms', filter: `id=eq.${roomId}` }, (payload) => {
          roomData = payload.new;
          updateUI();
        })
        .subscribe();

      db.channel(`ttt-p-${roomId}`)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'game_room_players', filter: `room_id=eq.${roomId}` }, () => {
          loadRoom(roomId);
        })
        .subscribe();
    }

    async function handleLogout() {
      await db.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
